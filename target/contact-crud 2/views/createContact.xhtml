<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://java.sun.com/jsf/html"
      xmlns:p="http://primefaces.org/ui">
<h:head>
    <title>Crear Contacto</title>
</h:head>
<h:body>
    <h:form>
        <p:panel header="Crear Contacto">
            <p:messages autoUpdate="true" />
            
            <p:panelGrid columns="2" columnClasses="label,value">
                <h:outputLabel value="Nombre:" />
                <p:inputText value="#{contactController.contact.nombre}" required="true" />

                <h:outputLabel value="Apellido:" />
                <p:inputText value="#{contactController.contact.apellido}" required="true" />

                <h:outputLabel value="Teléfono:" />
                <p:inputMask value="#{contactController.contact.telefono}" mask="(999)999-9999" />

                <h:outputLabel value="Correo:" />
                <p:inputText value="#{contactController.contact.correoElectronico}" required="true" />

                <h:outputLabel value="Dirección:" />
                <p:inputText value="#{contactController.contact.direccion}" />

                <h:outputLabel value="Fotografía:" />
                <p:inputText value="#{contactController.contact.fotografia}" />
            </p:panelGrid>

            <p:commandButton value="Guardar" action="#{contactController.save}" update="@form" />
            <p:commandButton value="Regresar" action="listContacts.xhtml?faces-redirect=true" />
        </p:panel>
    </h:form>
</h:body>
</html>
